services:
  larkbox:
    build: .
    ports:
      - "127.0.0.1:${LARKBOX_PORT:-8080}:8080"
    environment:
      LARKBOX_SANDBOX_TOKEN: "${LARKBOX_SANDBOX_TOKEN:-}"
      LARKBOX_PPROF: "${LARKBOX_PPROF:-false}"
      LARKBOX_RATE_LIMITS: '${LARKBOX_RATE_LIMITS:-{"profile":"unlimited"}}'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m
