name: Container image

on:
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - compose.persist.yaml
      - .dockerignore
      - .github/workflows/image.yml
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start and check the sandbox
        env:
          LARKBOX_SANDBOX_TOKEN: ci-synthetic-control
        run: |
          docker compose up --build --wait
          curl --fail --silent http://127.0.0.1:8080/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/_sandbox/state)" = 401
          curl --fail --silent --header "Authorization: Bearer $LARKBOX_SANDBOX_TOKEN" http://127.0.0.1:8080/_sandbox/metrics
      - name: Check durable storage on a named volume
        env:
          LARKBOX_SANDBOX_TOKEN: ci-synthetic-control
        run: |
          docker compose -f compose.yaml -f compose.persist.yaml up --wait
          docker compose -f compose.yaml -f compose.persist.yaml exec -T larkbox test -s /data/state.json
          docker compose -f compose.yaml -f compose.persist.yaml up --force-recreate --wait
          curl --fail --silent http://127.0.0.1:8080/healthz
      - name: Collect logs and stop
        if: always()
        run: |
          docker compose logs
          docker compose -f compose.yaml -f compose.persist.yaml down --volumes

  publish:
    name: Publish versioned image
    needs: compose
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag and choose image
        id: release
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.release.outputs.image }}
          push: true
